  <title id="title">Peta stack Maulana Muhammad Ikhsan</title>
  <desc id="desc">Tiga lapisan kerja: antarmuka dengan React, TypeScript, dan Next.js; alur dan integrasi dengan Laravel, FastAPI, dan Accurate Online API; data dan otomasi dengan PostgreSQL, Python, dan SheetJS.</desc>
